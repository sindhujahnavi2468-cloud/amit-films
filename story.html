<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Love Story | Amit Films Photography</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--cream:#FAF8F4;--brown:#2A1A0E;--gold:#A8844A;--gold-l:#C9A96E;--grey:#7A7065}
body{background:var(--cream);color:var(--brown);font-family:'Montserrat',sans-serif;font-weight:300}
.top{display:flex;justify-content:space-between;align-items:center;padding:20px 40px;border-bottom:1px solid #DDD8CF}
.top a{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--gold);text-decoration:none}
.brand{font-family:'Cormorant Garamond',serif;font-size:22px;color:var(--brown)}
.hero{position:relative;height:70vh;min-height:380px;background:#241508 center/cover;display:flex;align-items:flex-end}
.hero::after{content:'';position:absolute;inset:0;background:linear-gradient(to top,rgba(20,12,4,.8),rgba(20,12,4,.1) 60%)}
.hero div{position:relative;z-index:1;padding:40px;color:#FAF8F4}
.hero small{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--gold-l)}
.hero h1{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:400;font-size:clamp(34px,6vw,72px);margin-top:8px}
.gal{columns:3;column-gap:4px;padding:4px}
.gal img{width:100%;display:block;margin-bottom:4px;cursor:zoom-in}
.note{text-align:center;padding:80px 20px;color:var(--grey);font-size:12px;letter-spacing:1px}
.lb{position:fixed;inset:0;background:rgba(20,12,4,.95);display:none;align-items:center;justify-content:center;z-index:50;cursor:zoom-out}
.lb.open{display:flex}.lb img{max-width:92vw;max-height:92vh}
@media(max-width:768px){.gal{columns:2}.top{padding:16px 20px}.hero div{padding:24px}}
</style>
</head>
<body>
<div class="top"><span class="brand">Amit Films Photography</span><a href="index.html#stories">← All Stories</a></div>
<div class="hero" id="hero"><div><small id="meta"></small><h1 id="name">Loading…</h1></div></div>
<div class="gal" id="gal"></div>
<div class="lb" id="lb" onclick="this.classList.remove('open')"><img id="lbImg" alt=""/></div>
<script>
const BIN_ID='PASTE_YOUR_BIN_ID_HERE'; /* same Bin ID as index.html */
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
(async()=>{
  const id=new URLSearchParams(location.search).get('id');
  try{
    const r=await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest?t=${Date.now()}`,{headers:{'X-Bin-Meta':'false'}});
    const d=await r.json();const s=((d.record||d).stories||[]).find(x=>x.id===id);
    if(!s)throw 0;
    document.title=s.name+' | Amit Films Photography';
    document.getElementById('name').textContent=s.name;
    document.getElementById('meta').textContent=(s.tag||'')+' · '+(s.location||'');
    if(s.cover)document.getElementById('hero').style.backgroundImage=`url('${s.cover}')`;
    const g=s.gallery||[];
    document.getElementById('gal').innerHTML=g.length?g.map(u=>`<img loading="lazy" src="${esc(u)}" alt="" onclick="document.getElementById('lbImg').src=this.src;document.getElementById('lb').classList.add('open')"/>`).join(''):'';
    if(!g.length)document.getElementById('gal').outerHTML='<div class="note">This story\'s gallery is coming soon.</div>';
  }catch(e){
    document.getElementById('name').textContent='Story not found';
    document.getElementById('gal').outerHTML='<div class="note">We couldn\'t load this story. <a href="index.html" style="color:#A8844A">Back to home</a></div>';
  }
})();
</script>
</body>
</html>
